name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: install bubblewrap (real sandbox test for acceptance #47)
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap
          # Ubuntu 24.04 blocks unprivileged user namespaces via AppArmor; bwrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --ro-bind / / true && echo "bwrap ok"
      - name: mivo-watcher tests
        run: node --env-file=watchers/mivo/test.env --test watchers/mivo/*.test.mjs
      - name: cindy-watcher tests
        run: node --env-file=watchers/cindy/test.env --test watchers/cindy/*.test.mjs
      - name: cindy-watcher python tests
        run: python3 -B watchers/cindy/cindy-watch-script.test.py
      - name: acceptance-watcher tests
        run: node --env-file=watchers/acceptance/test.env --test watchers/acceptance/*.test.mjs
      - name: check sanitized (generic patterns only; CI has no local denylist)
        run: node scripts/check-sanitized.mjs
