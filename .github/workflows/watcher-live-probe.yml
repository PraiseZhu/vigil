name: watcher-live-probe
on:
  pull_request:
    branches: [test/watcher-live-base-20261006]
permissions:
  contents: read
jobs:
  probe:
    name: watcher-live-probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node scripts/watcher-live-probe/check.mjs
